name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: pip install -e ".[dev]" build

      - name: Run unit tests
        run: pytest -q

      - name: Run reproducible demo
        run: python examples/demo.py

      - name: Build Python package
        run: python -m build
