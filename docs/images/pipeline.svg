<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GenAI Learning Observatory analysis pipeline</title><desc id="desc">Five stage inspectable analysis pipeline from event ingestion to agency-oriented reporting.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08"/></filter><style>
.bg{fill:#f7f8fb}.ink{fill:#18202f}.muted{fill:#647087}.card{fill:#fff;stroke:#d9dfea;stroke-width:2;filter:url(#s)}.small{font:500 22px Inter,system-ui,sans-serif}.body{font:600 25px Inter,system-ui,sans-serif}.head{font:800 42px Inter,system-ui,sans-serif}.title{font:800 58px Inter,system-ui,sans-serif}
</style></defs>
<rect class="bg" width="1600" height="900" rx="28"/><text x="82" y="105" class="title ink">Inspectable analysis pipeline</text><text x="84" y="148" class="small muted">Each stage leaves an artifact you can inspect, test, and replace.</text>
<path d="M164 380H1436" stroke="#c9d0dc" stroke-width="8" stroke-linecap="round"/>
<g transform="translate(88 250)"><rect class="card" width="250" height="260" rx="26"/><circle cx="48" cy="50" r="24" fill="#e9f0ff"/><text x="39" y="59" class="body" fill="#2d6cdf">1</text><text x="32" y="112" class="head ink">Ingest</text><text x="32" y="155" class="small muted">Raw learner–AI</text><text x="32" y="187" class="small muted">interaction events</text><rect x="32" y="212" width="186" height="34" rx="10" fill="#f5f7fb"/><text x="48" y="236" class="small ink">events.csv</text></g>
<g transform="translate(382 250)"><rect class="card" width="250" height="260" rx="26"/><circle cx="48" cy="50" r="24" fill="#e9f7f5"/><text x="39" y="59" class="body" fill="#1c8c83">2</text><text x="32" y="112" class="head ink">Tag</text><text x="32" y="155" class="small muted">Transparent intent</text><text x="32" y="187" class="small muted">categories</text><rect x="32" y="212" width="186" height="34" rx="10" fill="#f5f7fb"/><text x="48" y="236" class="small ink">intent labels</text></g>
<g transform="translate(676 250)"><rect class="card" width="250" height="260" rx="26"/><circle cx="48" cy="50" r="24" fill="#fff3e9"/><text x="39" y="59" class="body" fill="#cf6a1b">3</text><text x="32" y="112" class="head ink">Extract</text><text x="32" y="155" class="small muted">Behavioral signals</text><text x="32" y="187" class="small muted">and rates</text><rect x="32" y="212" width="186" height="34" rx="10" fill="#f5f7fb"/><text x="48" y="236" class="small ink">features.csv</text></g>
<g transform="translate(970 250)"><rect class="card" width="250" height="260" rx="26"/><circle cx="48" cy="50" r="24" fill="#f1ecff"/><text x="39" y="59" class="body" fill="#7750c7">4</text><text x="32" y="112" class="head ink">Aggregate</text><text x="32" y="155" class="small muted">Session-level</text><text x="32" y="187" class="small muted">summaries</text><rect x="32" y="212" width="186" height="34" rx="10" fill="#f5f7fb"/><text x="48" y="236" class="small ink">sessions.csv</text></g>
<g transform="translate(1264 250)"><rect class="card" width="250" height="260" rx="26"/><circle cx="48" cy="50" r="24" fill="#ffecec"/><text x="39" y="59" class="body" fill="#c94f4f">5</text><text x="32" y="112" class="head ink">Report</text><text x="32" y="155" class="small muted">Agency-oriented</text><text x="32" y="187" class="small muted">reflection surface</text><rect x="32" y="212" width="186" height="34" rx="10" fill="#f5f7fb"/><text x="48" y="236" class="small ink">metrics.json</text></g>
<g fill="#7b8494"><polygon points="365,380 345,368 345,392"/><polygon points="659,380 639,368 639,392"/><polygon points="953,380 933,368 933,392"/><polygon points="1247,380 1227,368 1227,392"/></g>
<rect x="88" y="604" width="1426" height="150" rx="26" fill="#fff" stroke="#d9dfea" stroke-width="2"/><text x="126" y="653" class="body ink">Cross-cutting audit trail</text><text x="126" y="697" class="small muted">seed + schema + feature definitions + assumptions + test coverage + limitations</text><text x="126" y="731" class="small muted">The point is not to hide complexity. It is to make every transformation inspectable.</text>
</svg>