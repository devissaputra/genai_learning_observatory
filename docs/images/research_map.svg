<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GenAI Learning Observatory research map</title><desc id="desc">Research map connecting questions to observable measures, validity risks, and next empirical tests.</desc>
<defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-opacity="0.06"/></filter><style>
.bg{fill:#f7f8fb}.ink{fill:#18202f}.muted{fill:#657086}.card{fill:#fff;stroke:#d9dfea;stroke-width:2;filter:url(#s)}.small{font:500 20px Inter,system-ui,sans-serif}.body{font:600 23px Inter,system-ui,sans-serif}.head{font:800 34px Inter,system-ui,sans-serif}.title{font:800 56px Inter,system-ui,sans-serif}
</style></defs>
<rect class="bg" width="1600" height="900" rx="28"/><text x="80" y="100" class="title ink">Research map</text><text x="82" y="142" class="small muted">Question → implemented evidence → validity risk → next empirical test</text>
<g transform="translate(80 202)"><text x="18" y="0" class="head ink">Question</text><text x="402" y="0" class="head ink">Implemented evidence</text><text x="786" y="0" class="head ink">Validity risk</text><text x="1170" y="0" class="head ink">Next test</text>
<g transform="translate(0 36)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="42" class="body" fill="#2d6cdf">RQ1</text><text x="24" y="82" class="body ink">Help-seeking or passive</text><text x="24" y="114" class="body ink">answer adoption?</text></g>
<g transform="translate(384 36)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="46" class="body ink">Verification rate</text><text x="24" y="84" class="body ink">Revision rate</text><text x="24" y="122" class="body ink">Adoption rate</text></g>
<g transform="translate(768 36)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Same click pattern can</text><text x="24" y="82" class="body ink">mean different things.</text><text x="24" y="124" class="small muted">Construct validity</text></g>
<g transform="translate(1152 36)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Code a sample with</text><text x="24" y="82" class="body ink">learner self-reports.</text><text x="24" y="124" class="small muted">Human validation</text></g>
<g transform="translate(0 238)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="42" class="body" fill="#1c8c83">RQ2</text><text x="24" y="82" class="body ink">Which sequences signal</text><text x="24" y="114" class="body ink">verification and reflection?</text></g>
<g transform="translate(384 238)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Intent diversity</text><text x="24" y="86" class="body ink">Verification / reflection</text><text x="24" y="122" class="body ink">Session aggregates</text></g>
<g transform="translate(768 238)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Rules may be brittle</text><text x="24" y="82" class="body ink">across tasks.</text><text x="24" y="124" class="small muted">Robustness</text></g>
<g transform="translate(1152 238)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Compare rule-based and</text><text x="24" y="82" class="body ink">sequence models.</text><text x="24" y="124" class="small muted">Out-of-task evaluation</text></g>
<g transform="translate(0 440)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="42" class="body" fill="#7750c7">RQ3</text><text x="24" y="82" class="body ink">How should uncertainty</text><text x="24" y="114" class="body ink">be represented?</text></g>
<g transform="translate(384 440)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">No uncertainty model yet</text><text x="24" y="86" class="body ink">Rules stay inspectable</text><text x="24" y="122" class="body ink">Synthetic demo only</text></g>
<g transform="translate(768 440)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Users may over-trust</text><text x="24" y="82" class="body ink">clean-looking metrics.</text><text x="24" y="124" class="small muted">Interpretation risk</text></g>
<g transform="translate(1152 440)"><rect class="card" width="330" height="166" rx="22"/><text x="24" y="50" class="body ink">Co-design dashboard</text><text x="24" y="82" class="body ink">with learners + teachers.</text><text x="24" y="124" class="small muted">Usefulness study</text></g>
</g>
<path d="M412 321h40M796 321h40M1180 321h40M412 523h40M796 523h40M1180 523h40M412 725h40M796 725h40M1180 725h40" stroke="#aab3c3" stroke-width="3" stroke-linecap="round"/>
</svg>